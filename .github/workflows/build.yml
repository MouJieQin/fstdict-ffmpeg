name: Build Ffmpeg Cross Platform
on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    build-macos:
        runs-on: macos-14
        steps:
            - uses: actions/checkout@v4
            - name: Install Build Dependencies
              run: brew install nasm
            - name: Download source archive
              run: bash download-source.sh
            - name: Build mac binaries
              run: bash build-macos.sh
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: build-macos
                  path: dist/ffmpeg-macos-*

    build-linux:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - name: Install musl cross compiler
              run: sudo apt update && sudo apt install -y musl-tools make gcc nasm
            - name: Download source archive
              run: bash download-source.sh
            - name: Build linux musl static
              run: bash build-linux-musl.sh
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: build-linux
                  path: dist/ffmpeg-linux-x86_64

    build-windows:
        runs-on: windows-latest
        defaults:
            run:
                shell: msys2 {0}
        steps:
            - uses: actions/checkout@v4
            - uses: msys2/setup-msys2@v2
              with:
                  msystem: MINGW64
                  update: true
                  install: mingw-w64-x86_64-gcc make curl
            - name: Download source archive
              run: bash download-source.sh
            - name: Build windows binary
              run: bash build-windows-msys2.sh
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: build-windows
                  path: dist/ffmpeg-windows-x86_64.exe

    release:
        # 仅在非手动触发时运行 release 作业（即只有当有匹配 v* 的标签推送时才运行）
        if: github.event_name != 'workflow_dispatch'
        needs: [build-macos, build-linux, build-windows]
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  merge-multiple: true

            - name: Generate SHA256 sum and Release Body
              run: |
                  # 计算哈希值并输出为标准文本格式
                  sha256sum \
                    ffmpeg-macos-arm64 \
                    ffmpeg-macos-x86_64 \
                    ffmpeg-macos-universal \
                    ffmpeg-linux-x86_64 \
                    ffmpeg-windows-x86_64.exe > sha256sums.txt

                  # 动态拼接 Markdown 表格作为 Release 文本描述
                  echo "## 📦 Build Artifacts Verification" > release_notes.md
                  echo "The following table displays the files generated for this release along with their SHA256 checksums to ensure file integrity." >> release_notes.md
                  echo "" >> release_notes.md
                  echo "| File Name | SHA256 Checksum |" >> release_notes.md
                  echo "| :--- | :--- |" >> release_notes.md

                  # 逐行读取哈希文本并将其格式化为 Markdown 行结构
                  while read -r hash file; do
                      echo "| \`$file\` | \`$hash\` |" >> release_notes.md
                  done < sha256sums.txt

                  echo "" >> release_notes.md
                  echo "---" >> release_notes.md
                  echo "*Automated compilation powered by GitHub Actions.*" >> release_notes.md

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  # 提取触发标签名称 (如 v1.0.0)，并重命名为带有语义前缀的可读名称
                  name: "FFmpeg Build Release ${{ github.ref_name }}"
                  body_path: release_notes.md
                  files: |
                      ffmpeg-macos-arm64
                      ffmpeg-macos-x86_64
                      ffmpeg-macos-universal
                      ffmpeg-linux-x86_64
                      ffmpeg-windows-x86_64.exe
                      sha256sums.txt
                  draft: false
                  prerelease: false
