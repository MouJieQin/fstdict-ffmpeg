name: Build Ffmpeg Cross Platform
on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    build-macos:
        runs-on: macos-14
        steps:
            - uses: actions/checkout@v4
            - name: Install Build Dependencies
              run: brew install nasm
            - name: Download source archive
              run: bash download-source.sh
            - name: Build mac binaries
              run: bash build-macos.sh
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: build-macos
                  # 匹配该目录下的所有编译产物 (arm64, x86_64, 以及 universal)
                  path: dist/ffmpeg-macos-*

    build-linux:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - name: Install musl cross compiler
              run: sudo apt update && sudo apt install -y musl-tools make gcc nasm
            - name: Download source archive
              run: bash download-source.sh
            - name: Build linux musl static
              run: bash build-linux-musl.sh
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: build-linux
                  path: dist/ffmpeg-linux-x86_64

    build-windows:
        runs-on: windows-latest
        defaults:
            run:
                shell: msys2 {0}
        steps:
            - uses: actions/checkout@v4
            - uses: msys2/setup-msys2@v2
              with:
                  msystem: MINGW64
                  update: true
                  install: mingw-w64-x86_64-gcc make curl
            - name: Download source archive
              run: bash download-source.sh
            - name: Build windows binary
              run: bash build-windows-msys2.sh
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: build-windows
                  path: dist/ffmpeg-windows-x86_64.exe

    release:
        needs: [build-macos, build-linux, build-windows]
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  merge-multiple: true
            - name: Generate SHA256 sum
              run: |
                  # 包含 3 个 macOS 文件、1 个 Linux 文件、1 个 Windows 文件
                  sha256sum \
                    ffmpeg-macos-arm64 \
                    ffmpeg-macos-x86_64 \
                    ffmpeg-macos-universal \
                    ffmpeg-linux-x86_64 \
                    ffmpeg-windows-x86_64.exe > sha256sums.txt
                  cat sha256sums.txt
            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      ffmpeg-macos-arm64
                      ffmpeg-macos-x86_64
                      ffmpeg-macos-universal
                      ffmpeg-linux-x86_64
                      ffmpeg-windows-x86_64.exe
                      sha256sums.txt
                  draft: false
                  prerelease: false
