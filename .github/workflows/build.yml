name: Build Ffmpeg Cross Platform
on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    build-macos:
        runs-on: macos-14
        steps:
            - uses: actions/checkout@v4
            - name: Install Build Dependencies
              run: brew install nasm
            - name: Download source archive
              run: bash download-source.sh
            - name: Build mac binaries
              run: bash build-macos.sh
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: build-macos
                  path: dist/ffmpeg-macos-*.tar.gz

    build-linux:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - name: Install musl cross compiler
              run: sudo apt update && sudo apt install -y musl-tools make gcc nasm
            - name: Download source archive
              run: bash download-source.sh
            - name: Build linux musl static
              run: bash build-linux-musl.sh
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: build-linux
                  path: dist/ffmpeg-linux-x86_64.tar.gz

    build-windows:
        runs-on: windows-latest
        defaults:
            run:
                shell: msys2 {0}
        steps:
            - uses: actions/checkout@v4
            - uses: msys2/setup-msys2@v2
              with:
                  msystem: MINGW64
                  update: true
                  install: mingw-w64-x86_64-gcc make curl
            - name: Download source archive
              run: bash download-source.sh
            - name: Build windows binary
              run: bash build-windows-msys2.sh
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: build-windows
                  path: dist/ffmpeg-windows-x86_64.zip

    release:
        if: github.event_name != 'workflow_dispatch'
        needs: [build-macos, build-linux, build-windows]
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  merge-multiple: true

            - name: Generate SHA256 sum and Release Body
              run: |
                  sha256sum \
                    ffmpeg-macos-arm64.tar.gz \
                    ffmpeg-macos-x86_64.tar.gz \
                    ffmpeg-macos-universal.tar.gz \
                    ffmpeg-linux-x86_64.tar.gz \
                    ffmpeg-windows-x86_64.zip > sha256sums.txt

                  echo "## 📦 Build Artifacts Verification" > release_notes.md
                  echo "The following table displays the files generated for this release along with their SHA256 checksums to ensure file integrity." >> release_notes.md
                  echo "" >> release_notes.md
                  echo "| File Name | SHA256 Checksum |" >> release_notes.md
                  echo "| :--- | :--- |" >> release_notes.md

                  while read -r hash file; do
                      echo "| \`$file\` | \`$hash\` |" >> release_notes.md
                  done < sha256sums.txt

                  echo "" >> release_notes.md
                  echo "### 🍏 macOS Usage Instructions" >> release_notes.md
                  echo "Since these files are compiled on an automated cloud environment, macOS Gatekeeper might block them upon extraction. If the program gets blocked or terminated, run this command in your terminal to allow execution:" >> release_notes.md
                  echo "\`\`\`bash" >> release_notes.md
                  echo "xattr -d com.apple.quarantine ffmpeg" >> release_notes.md
                  echo "\`\`\`" >> release_notes.md
                  echo "" >> release_notes.md
                  echo "---" >> release_notes.md
                  echo "*Automated compilation powered by GitHub Actions.*" >> release_notes.md

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  name: "${{ github.ref_name }}"
                  body_path: release_notes.md
                  files: |
                      ffmpeg-macos-arm64.tar.gz
                      ffmpeg-macos-x86_64.tar.gz
                      ffmpeg-macos-universal.tar.gz
                      ffmpeg-linux-x86_64.tar.gz
                      ffmpeg-windows-x86_64.zip
                      sha256sums.txt
                  draft: false
                  prerelease: false
